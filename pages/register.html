<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FJIS Academy — Daftar Akun</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#f8f6f1,#eef4f1);
  color:#26332e;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px;
}
.card{
  width:min(980px,100%);
  background:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 20px 60px rgba(40,55,48,.12);
  border-radius:26px;
  padding:30px;
  backdrop-filter:blur(14px);
}
.brand{text-align:center;margin-bottom:24px}
.brand h1{margin:0;font-size:28px;letter-spacing:-.5px}
.brand p{margin:7px 0 0;color:#708078;font-size:14px}
.layout{display:grid;grid-template-columns:1fr 1.35fr;gap:28px}
.panel{
  background:rgba(255,255,255,.7);
  border:1px solid #e6ebe8;
  border-radius:20px;
  padding:22px;
}
h2{font-size:18px;margin:0 0 8px}
.sub{font-size:13px;color:#77847e;margin-bottom:18px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}
input{
  width:100%;padding:12px 13px;border:1px solid #dce4df;border-radius:11px;
  outline:none;background:#fff;font-size:14px;
}
input:focus{border-color:#7e9f90;box-shadow:0 0 0 3px rgba(126,159,144,.12)}
button{
  border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;
}
.submit{width:100%;margin-top:18px;background:#29483b;color:white}
.submit:hover{background:#203a30}
.error{
  display:none;margin-top:12px;padding:10px 12px;border-radius:10px;
  background:#fff0f0;color:#a13c3c;font-size:13px
}
.success{font-size:13px;color:#527466;margin-top:10px;min-height:18px}
.avatar-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:11px;
  max-height:530px;overflow:auto;padding:3px;
}
.avatar-card{
  position:relative;min-height:126px;border:1px solid #e2e8e4;
  background:#fff;border-radius:16px;padding:9px 6px 7px;
  cursor:pointer;text-align:center;transition:.18s ease;
}
.avatar-card:hover{transform:translateY(-2px);border-color:#9db4a9}
.avatar-card.selected{
  border:2px solid #29483b;
  background:#f3f8f5;
  box-shadow:0 6px 18px rgba(41,72,59,.12)
}
.avatar-card svg{width:82px;height:82px;display:block;margin:auto}
.avatar-name{font-size:11px;font-weight:800;color:#50625a;margin-top:2px}
.check{
  display:none;position:absolute;right:7px;top:7px;
  width:20px;height:20px;border-radius:50%;background:#29483b;color:white;
  font-size:12px;align-items:center;justify-content:center
}
.avatar-card.selected .check{display:flex}
.selected-info{
  margin-top:12px;padding:10px 12px;border-radius:11px;background:#f1f6f3;
  font-size:13px;color:#52645c
}
@media(max-width:780px){
  .layout{grid-template-columns:1fr}
  .avatar-grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:480px){
  .card{padding:18px}
  .avatar-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>FJIS Academy</h1>
    <p>Student Learner — Buat akun dan pilih avatar kamu.</p>
  </div>

  <div class="layout">
    <section class="panel">
      <h2>Buat Akun</h2>
      <div class="sub">Data akun akan tersimpan di browser ini.</div>

      <form id="registerForm" autocomplete="off">
        <label for="name">Nama</label>
        <input id="name" type="text" placeholder="Nama kamu" required maxlength="60">

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="nama@email.com" required>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Minimal 6 karakter" required minlength="6">

        <div class="success" id="selectedInfo">Belum memilih avatar.</div>
        <div class="error" id="errorBox"></div>

        <button class="submit" type="submit">Buat Akun</button>
      </form>
    </section>

    <section class="panel">
      <h2>Pilih Avatar</h2>
      <div class="sub">Bukan karakter manusia — pilih mascot yang paling cocok dengan kamu.</div>
      <div class="avatar-grid" id="avatarGrid"></div>
    </section>
  </div>
</div>

const grid = document.getElementById("avatarGrid");
const info = document.getElementById("selectedInfo");
const form = document.getElementById("registerForm");
const errorBox = document.getElementById("errorBox");

let selectedAvatar = null;

AVATARS.forEach((avatar, index) => {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "avatar-card";
  card.dataset.id = avatar.id;
  card.innerHTML = `
    <span class="check">✓</span>
    ${avatar.svg}
    <div class="avatar-name">${avatar.name}</div>
  `;
  card.addEventListener("click", () => {
    document.querySelectorAll(".avatar-card").forEach(x => x.classList.remove("selected"));
    card.classList.add("selected");
    selectedAvatar = {
      id: avatar.id,
      name: avatar.name,
      svg: avatar.svg
    };
    info.textContent = "Avatar dipilih: " + avatar.name;
  });
  grid.appendChild(card);
});

function showError(message){
  errorBox.textContent = message;
  errorBox.style.display = "block";
}
function clearError(){
  errorBox.textContent = "";
  errorBox.style.display = "none";
}

const FJIS_REGISTRATION_ENDPOINT = "https://script.google.com/macros/s/AKfycbzIlJNCAiA24q7qYtlSiZAsdLqmH6ft6L7WcKrs0Oso92LsgkseqpwFvwwLQBw8o-W6/exec";

form.addEventListener("submit", async function(e){
  e.preventDefault();
  clearError();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;

  if(name.length < 2) return showError("Nama minimal 2 karakter.");
  if(password.length < 6) return showError("Password minimal 6 karakter.");
  if(!selectedAvatar) return showError("Pilih avatar dulu bro.");

  let accounts = [];
  try {
    accounts = JSON.parse(localStorage.getItem("fjis_accounts") || "[]");
    if(!Array.isArray(accounts)) accounts = [];
  } catch(e) {
    accounts = [];
  }

  if(accounts.some(acc => String(acc.email || "").toLowerCase() === email)){
    return showError("Email itu sudah terdaftar. Gunakan email lain.");
  }

  const now = new Date().toISOString();

  const account = {
    id: "fjis-" + Date.now(),
    name,
    email,
    password,
    level: "Student Learner",
    avatar: {
      id: selectedAvatar.id,
      name: selectedAvatar.name
    },
    avatarSvg: selectedAvatar.svg,
    createdAt: now,
    progress: 0
  };

  accounts.push(account);
  localStorage.setItem("fjis_accounts", JSON.stringify(accounts));

  // Kompatibilitas dengan bagian project lama.
  localStorage.setItem("fjis_user_name", name);
  localStorage.setItem("fjis_user_email", email);
  localStorage.setItem("fjis_user_avatar", JSON.stringify(account.avatar));
  localStorage.setItem("fjis_user_avatar_svg", selectedAvatar.svg);
  localStorage.setItem("fjis_progress", "0");
  localStorage.setItem("fjis_registered", "1");

  // REGISTER BELUM MEMBUAT SESI LOGIN.
  // Sesi aktif hanya dibuat setelah email + password berhasil
  // diautentikasi di login.html.
  localStorage.removeItem("fjis_current_user");
  localStorage.removeItem("fjis_logged_in");
  localStorage.removeItem("fjis_session");

  // Notifikasi pendaftaran ke Gmail admin.
  // Password TIDAK pernah dikirim.
  try {
    await fetch(FJIS_REGISTRATION_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        name: account.name,
        email: account.email,
        level: account.level,
        avatar: account.avatar.name,
        createdAt: account.createdAt
      })
    });
  } catch (notificationError) {
    // Registrasi lokal tetap berhasil walaupun notifikasi Gmail gagal.
    console.warn("Notifikasi Gmail gagal:", notificationError);
  }

  const params = new URLSearchParams(window.location.search);
  const redirect = params.get("redirect");
  const loginUrl = redirect
    ? "./login.html?registered=1&redirect=" + encodeURIComponent(redirect)
    : "./login.html?registered=1";
  window.location.href = loginUrl;
});
</script>
