<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Informasi Kedinasan | FJIS Academy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f6f2;
            color: #222;
        }

        .page {
            width: min(1100px, 92%);
            margin: auto;
            padding: 30px 0 50px;
        }

        .back {
            display: inline-block;
            padding: 9px 14px;
            margin-bottom: 35px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header small {
            color: #777;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        .header h1 {
            font-size: 34px;
            margin: 10px 0;
        }

        .header p {
            color: #777;
            line-height: 1.6;
        }

        .search-box {
            margin: 25px auto 35px;
            max-width: 650px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background: #fff;
        }

        .search-box input:focus {
            border-color: #aaa;
        }

        .list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .card {
            background: #fff;
            border: 1px solid #e3e1dc;
            border-radius: 14px;
            padding: 23px;
            transition: 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            margin-bottom: 12px;
            border-radius: 6px;
            background: #f0efea;
            color: #666;
            font-size: 11px;
            font-weight: bold;
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 7px;
        }

        .singkatan {
            color: #777;
            font-size: 13px;
            margin-bottom: 13px;
        }

        .card p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .meta {
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .meta div {
            margin-bottom: 7px;
            font-size: 13px;
        }

        .meta strong {
            color: #333;
        }

        .detail-button {
            display: inline-block;
            margin-top: 12px;
            color: #333;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #888;
            background: #fff;
            border-radius: 12px;
        }

        @media (max-width: 700px) {
            .list {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <a href="../kedinasan.html" class="back">
            ← Kembali
        </a>

        <header class="header">
            <small>FJIS ACADEMY</small>

            <h1>Informasi Kedinasan</h1>

            <p>
                Temukan informasi mengenai sekolah kedinasan,
                jalur rekrutmen, persyaratan, dan tahapan seleksi.
            </p>
        </header>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Cari IPDN, STAN, STIS, STMKG, AKPOL..."
                autocomplete="off"
            >
        </div>

        <section id="kedinasanList" class="list">
            <!-- Data akan dimuat melalui JavaScript -->
        </section>

    </main>

    <script src="./data-kedinasan.js"></script>
    <script src="./kedinasan-detail.js"></script>

</body>
</html>
