name: Update Scholarship Feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update scholarship feed
        run: node scripts/update-scholarships.js

      - name: Save updated feed
        run: |
          git config user.name "FJIS Academy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/kuliah/sources/scholarship-feed.json
          git diff --cached --quiet || git commit -m "chore: update scholarship feed"
          git push